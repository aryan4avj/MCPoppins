<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCPoppins Live Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0f;color:#e0e0e8;min-height:100vh;display:flex;flex-direction:column}.header{padding:16px 24px;border-bottom:1px solid #1a1a2e;display:flex;align-items:center;gap:12px}.header .mark{width:32px;height:32px;background:#2457ff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff}.header h1{font-size:16px;font-weight:600}.header .st{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:99px}.st.ok{background:#0d3320;color:#4ade80}.st.off{background:#331a1a;color:#f87171}.msgs{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}.m{max-width:85%;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}.m.u{align-self:flex-end;background:#2457ff;color:#fff;border-bottom-right-radius:4px}.m.b{align-self:flex-start;background:#1a1a2e;border-bottom-left-radius:4px}.m .meta{font-size:11px;color:#888;margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}.m .meta span{background:#0d0d1a;padding:2px 8px;border-radius:4px}.sug{display:flex;gap:8px;flex-wrap:wrap;padding:0 24px 8px}.sug button{background:#1a1a2e;border:1px solid #2a2a3e;color:#a0a0b8;padding:6px 14px;border-radius:99px;font-size:12px;cursor:pointer}.sug button:hover{background:#2457ff;color:#fff;border-color:#2457ff}.bar{padding:16px 24px;border-top:1px solid #1a1a2e;display:flex;gap:10px}.bar input{flex:1;background:#1a1a2e;border:1px solid #2a2a3e;color:#e0e0e8;padding:12px 16px;border-radius:10px;font-size:14px;outline:none}.bar input:focus{border-color:#2457ff}.bar button{background:#2457ff;color:#fff;border:none;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}.bar button:disabled{opacity:.5}.typ{align-self:flex-start;padding:12px 16px;background:#1a1a2e;border-radius:12px;font-size:13px;color:#888}.foot{text-align:center;padding:8px;font-size:11px}.foot a{color:#2457ff;text-decoration:none}
</style>
</head>
<body>
<div class="header"><div class="mark">MP</div><h1>MCPoppins</h1><div class="st off" id="st">Checking...</div></div>
<div class="msgs" id="msgs"><div class="m b">Welcome to MCPoppins. I connect Jira and Confluence to any channel.<br><br>Try: "show my issues", "project status", or type an issue key like NAS-1237<div class="meta"><span>Gateway v2</span><span>Read-only default</span></div></div></div>
<div class="sug" id="sug"><button onclick="go('show my issues')">My issues</button><button onclick="go('project status')">Project status</button><button onclick="go('high priority issues')">High priority</button><button onclick="go('help')">Help</button></div>
<div class="bar"><input id="inp" placeholder="Ask about Jira or Confluence..." autocomplete="off"><button id="btn" onclick="go()">Send</button></div>
<div class="foot"><a href="/audit?limit=20" target="_blank">Audit trail</a> · <a href="/tools" target="_blank">Tools</a> · <a href="/health" target="_blank">Health</a></div>
<script>
const G=location.origin,uid="demo-"+Math.random().toString(36).slice(2,8),ms=document.getElementById("msgs"),inp=document.getElementById("inp"),sg=document.getElementById("sug"),st=document.getElementById("st"),btn=document.getElementById("btn");
fetch(G+"/health").then(r=>r.json()).then(d=>{st.textContent=d.tools+" tools · "+(d.connectors?.jira?"Jira":"")+(d.connectors?.confluence?" + Confluence":"");st.className="st ok"}).catch(()=>{st.textContent="Offline";st.className="st off"});
inp.onkeypress=e=>{if(e.key==="Enter"&&!btn.disabled)go()};
async function go(t){const m=t||inp.value.trim();if(!m)return;inp.value="";sg.innerHTML="";add(m,"u");const ty=add("Thinking...","typ");btn.disabled=true;try{const r=await(await fetch(G+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m,channel:"web",userId:uid})})).json();ty.remove();let rp=r.reply||r.error||"No response.";rp=rp.replace(/^# (.+)$/gm,'<strong style="font-size:16px">$1</strong>').replace(/^## (.+)$/gm,'<strong style="font-size:14px;color:#a0a0ff">$1</strong>').replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");let mt='<div class="meta">';if(r.intent)mt+=`<span>${r.intent}</span>`;if(r.toolsCalled?.length)mt+=`<span>${r.toolsCalled.join(", ")}</span>`;if(r.ms)mt+=`<span>${r.ms}ms</span>`;if(r.sources?.length)mt+=`<span>${r.sources.filter(s=>s.status==="ok").map(s=>s.system).join(", ")}</span>`;mt+=`<span>${r.id?.slice(0,8)}</span></div>`;const d=document.createElement("div");d.className="m b";d.innerHTML=rp+mt;ms.appendChild(d);if(r.suggestions?.length)sg.innerHTML=r.suggestions.map(s=>`<button onclick="go('${s.replace(/'/g,"\\'")}')">${s}</button>`).join("")}catch(e){ty.remove();add("Error: "+e.message,"b")}btn.disabled=false;ms.scrollTop=ms.scrollHeight;inp.focus()}
function add(t,c){const d=document.createElement("div");d.className="m "+c;d.textContent=t;ms.appendChild(d);ms.scrollTop=ms.scrollHeight;return d}
</script>
</body>
</html>
